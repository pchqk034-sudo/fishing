# 毎朝の釣果収集 → 集計 → コミット。
# data/boats.json に catch_page / adapter を設定した船宿が対象になる。
# 収集先サイトの利用規約・robots.txt を確認してから有効化すること。
name: Collect catches daily

on:
  schedule:
    - cron: "0 21 * * *"   # JST 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect catches
        run: python scripts/collect_catches.py
        working-directory: .
      - name: Enrich with weather
        run: |
          f="data/catches/collected_$(date +%Y%m%d).jsonl"
          if [ -f "$f" ]; then python scripts/enrich_weather.py "$f"; fi
      - name: Aggregate
        run: python scripts/aggregate.py
      - name: Commit results
        run: |
          git config user.name "fishing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catches dashboard/data.js
          git diff --cached --quiet || git commit -m "chore: daily catch collection $(date +%Y-%m-%d)"
          git push
